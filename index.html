async function refreshMarket(){
  try{
    MARKET=(await api("/api/market")).positions||null;
    // Wurde gerade eine falsch geschaetzte Kontraktgroesse live korrigiert,
    // ist das zwar schon dauerhaft gespeichert, aber STATE.positions (und
    // damit die "Größe"-Anzeige) haengt noch auf dem alten Stand, bis wir
    // neu laden - sonst zeigt "Größe" den alten Wert, obwohl uPnL/Margin
    // schon mit dem richtigen rechnen.
    if((MARKET||[]).some(m=>m.ctValCorrected)){
      STATE = await api("/api/state");
    }
  }
  catch(e){ MARKET=[{errors:[String(e.message||e)]}]; }
  if(TAB==="positions"||TAB==="dash") render();
}
async function refreshDerived(){
  try{ PF=await api("/api/portfolio"); }catch(e){ PF=null; }
  try{ TAXR=await api("/api/tax"); }catch(e){ TAXR=null; }
  try{ CURVE=await api("/api/capital-curve"); }catch(e){ CURVE=null; }
  try{ FEES=await api("/api/fees"); }catch(e){ FEES=null; }
  if(TAB==="dash"||TAB==="tax") render();
}

async function boot(){
  try{ await window.pyReady; }
  catch(e){ return; } // Fehlertext steht schon im #pyLoading-Overlay
  try{ STATE=await api("/api/state"); }
  catch(e){ $("#panel").innerHTML=`<div class="card"><div class="empty">
    <h3>Start fehlgeschlagen</h3>
    <p style="font-family:var(--mono);font-size:12px;color:var(--down);
      word-break:break-word;text-align:left;background:var(--panel-2);
      border-radius:8px;padding:10px;margin:10px 0">${esc(String(e.message||e))}</p>
    <p>Seite neu laden und nochmal versuchen. Bleibt der Fehler bestehen,
    diesen Text weitergeben.</p></div></div>`; return; }
  render();
  if(STATE.hasData) refreshDerived();
  if((STATE.positions||[]).length) refreshMarket();
}

function exportDb(){
  try{
    const bytes = window.pyExportDb();
    const now = new Date();
    const d = now.toISOString().slice(0,10);
    const t = now.toTimeString().slice(0,5).replace(":","-");
    downloadBlob(bytes, "application/octet-stream", `Krypto-Tracker_${d}_${t}.db`);
    return true;
  }catch(e){
    alert("Export fehlgeschlagen: "+(e.message||e));
    return false;
  }
}
window.exportDb = exportDb;

$("#btnDbExport").onclick=()=>exportDb();

$("#btnDbImport").onclick=()=>$("#dbFile").click();
$("#dbFile").onchange=async(e)=>{
  const file = e.target.files[0]; if(!file) return;
  e.target.value = "";
  const bytes = new Uint8Array(await file.arrayBuffer());

  let check;
  try{ check = window.pyValidateImport(bytes); }
  catch(err){ alert("Datei konnte nicht geprüft werden: "+(err.message||err)); return; }
  if(!check.ok){ alert(check.error || "Diese Datei ist keine gültige Krypto-Tracker-Datenbank."); return; }

  const span = check.from ? `${day(check.from)} – ${day(check.to)}` : "keine Vorgänge";
  const sure = confirm(
    `Diese Datei enthält ${check.txCount} Vorgänge (${span}).\n\n`+
    `Deine aktuellen Daten in diesem Browser werden dadurch ERSETZT (ein `+
    `Backup der bisherigen liegt danach unter tracker.db.vor-import.bak `+
    `im Browser-Speicher). Die Seite lädt anschließend neu. Fortfahren?`);
  if(!sure) return;

  try{
    await window.pyCommitImport(bytes);
    location.reload();
  }catch(err){
    alert("Import fehlgeschlagen: "+(err.message||err));
  }
};

$("#btnReset").onclick=async()=>{
  if(!confirm("Alle Vorgänge löschen?")) return;
  STATE=await api("/api/reset",{}); MARKET=PF=TAXR=CURVE=FEES=TXD=null; render();};
$("#btnQuit").onclick=async()=>{
  if(!confirm("Wirklich schließen? Deine Daten bleiben im Browser gespeichert.")) return;
  try{ await window.pySync(); }catch(e){}
  document.body.innerHTML=`<div class="wrap"><div class="card" style="margin-top:70px">
    <div class="empty"><h3>Gespeichert</h3><p>Du kannst diesen Tab jetzt schließen.
    Deine Daten liegen lokal in diesem Browser und sind beim nächsten Öffnen wieder da.</p></div></div></div>`;};

// boot() wird erst ganz am Ende der Datei aufgerufen, nachdem window.pyReady
// definiert ist (siehe Pyodide-Bootstrap unten) - sonst wuerde boot() auf
// ein "await window.pyReady" warten, das zu dem Zeitpunkt noch gar nicht
// existiert.
</script>

<script src="pyodide/pyodide.js"></script>
<script>
// --- Pyodide-Bootstrap --------------------------------------------------
// Ersetzt den frueheren lokalen Python-Server: dieselbe Logik (ledger.py,
// tax.py, okx_import.py, market.py, webapi.py) laeuft jetzt direkt im
// Browser via WebAssembly. Die Datenbank liegt in IndexedDB (ueberlebt
// Neuladen/Neustart des Browsers), nichts verlaesst das Geraet.
window.pyReady = (async () => {
  const overlay = document.getElementById("pyLoading");
  try {
    const pyodide = await loadPyodide({ indexURL: "pyodide/" });

    pyodide.FS.mkdirTree("/persist");
    pyodide.FS.mount(pyodide.FS.filesystems.IDBFS, {}, "/persist");
    await new Promise((res, rej) =>
      pyodide.FS.syncfs(true, err => err ? rej(err) : res()));

    const files = ["ledger.py", "tax.py", "okx_import.py", "okx_api.py", "market.py",
                    "webapi.py", "pdf_report.py", "schema.sql"];
    for (const f of files) {
      // cache:"no-store" erzwingt jedes Mal einen frischen Abruf - sonst
      // liefert Safari nach einem Update auf GitHub gerne noch die alte,
      // im Cache liegende Version der .py-Dateien aus, ohne dass man das
      // am Fehlerbild erkennen könnte.
      const resp = await fetch("py/" + f, {cache: "no-store"});
      if (!resp.ok) {
        throw new Error(
          `Datei "py/${f}" konnte nicht geladen werden (HTTP ${resp.status}). `+
          `Vermutlich fehlt sie beim Hosting oder liegt am falschen Pfad - `+
          `prüfen, ob der komplette "py"-Ordner hochgeladen wurde.`);
      }
      const text = await resp.text();
      if (f.endsWith(".py") && /^\s*<!DOCTYPE|^\s*<html/i.test(text)) {
        throw new Error(
          `Datei "py/${f}" enthält HTML statt Python-Code - das Hosting liefert `+
          `dafür vermutlich eine Fehlerseite (404) statt der echten Datei aus.`);
      }
      pyodide.FS.writeFile("/" + f, text);
    }

    // PDF-Export: reportlab hat seit Version 5 einen reinen Python-Wheel
    // (kein Kompilat mehr) - laesst sich also per micropip von PyPI
    // installieren. Die einzige Abhaengigkeit, die reportlab intern immer
    // laedt (Pillow, fuer Bildverarbeitung, auch wenn unser Report keine
    // Bilder nutzt), ist ein von Pyodide selbst vorkompiliertes Paket -
    // kommt vom offiziellen Pyodide-CDN (jsDelivr), nicht von PyPI.
    // Schlaegt einer der Schritte fehl (z.B. kein Netzwerk), bleibt PDF
    // einfach unverfuegbar - webapi.py faengt das ab, CSV geht immer.
    try {
      await pyodide.loadPackage("pyodide-pkgs/micropip.whl");
      await pyodide.runPythonAsync(`
import micropip
await micropip.install(
    "https://cdn.jsdelivr.net/pyodide/v${pyodide.version}/full/"
    "pillow-12.2.0-cp314-cp314-pyemscripten_2026_0_wasm32.whl")
await micropip.install("reportlab")
`);
    } catch (e) {
      console.warn("PDF-Export nicht verfügbar (reportlab/Pillow konnten nicht "+
                   "geladen werden - vermutlich kein Netzwerkzugriff auf PyPI/"+
                   "jsDelivr von hier aus). CSV-Export bleibt unberührt.", e);
    }

    await pyodide.runPythonAsync(`
import sys
sys.path.insert(0, "/")
import webapi
`);

    const webapiDispatch = pyodide.globals.get("webapi").dispatch;
    window.pyDispatch = (method, path, bodyJson) =>
      webapiDispatch(method, path, bodyJson);
    window.pySync = () => new Promise((res, rej) =>
      pyodide.FS.syncfs(false, err => err ? rej(err) : res()));

    const DB_PATH = "/persist/tracker.db";
    const webapiValidate = pyodide.globals.get("webapi").validate_import;
    window.pyExportDb = () => pyodide.FS.readFile(DB_PATH);
    window.pyValidateImport = (bytes) => {
      pyodide.FS.writeFile("/tmp/import_check.db", bytes);
      const result = JSON.parse(webapiValidate("/tmp/import_check.db"));
      pyodide.FS.unlink("/tmp/import_check.db");
      return result;
    };
    window.pyCommitImport = async (bytes) => {
      // Backup der bisherigen Datei, falls das Ueberschreiben ungewollt war.
      try {
        const old = pyodide.FS.readFile(DB_PATH);
        pyodide.FS.writeFile(DB_PATH + ".vor-import.bak", old);
      } catch (e) { /* noch keine DB vorhanden - kein Backup noetig */ }
      pyodide.FS.writeFile(DB_PATH, bytes);
      await window.pySync();
    };

    if (overlay) overlay.remove();
  } catch (e) {
    if (overlay) overlay.innerHTML =
      `<div style="max-width:340px;text-align:center">
         <div style="font-weight:700;margin-bottom:8px">Start fehlgeschlagen</div>
         <div style="font-size:13px;color:var(--dim)">${(e && e.message) || e}</div>
       </div>`;
    throw e;
  }
})();

boot();
</script>
</body>
</html>
